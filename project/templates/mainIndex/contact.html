 {% extends 'base.html' %}
    {% load static %}

    {% block title %}Contact Expenses{% endblock %}

    {% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/total_expenses.css' %}">
    <link rel="stylesheet" href="{% static 'css/contact.css' %}">
    
    {% endblock %}

    {% block content %}

        <div class="contact-header text-center">
            <h1 class="contact-title">Contact Admin</h1>
                <p class="contact-subtitle">
                    Have questions or issues? Send a message to the admin team.
                </p>
        </div>

          <div class="row gx-5 justify-content-center">
                    <div class="col-lg-6">
                        <!-- * * * * * * * * * * * * * * *-->
                        <!-- to get contact form!-->
                        <form id="contactForm" method="POST">
                        {% csrf_token %}

                            <div class="form-floating mb-3">
                                <input class="form-control" name="name" type="text" placeholder="Enter your name..." required>
                                <label>Full name</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input class="form-control" name="email" type="email" placeholder="name@example.com" required>
                                <label>Email address</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input class="form-control" name="mobile" type="tel"
                                    pattern="[0-9]{10}" title="Please enter exactly 10 digit mobile number" placeholder="Enter 10 digit mobile" required>
                                <label>Phone number</label>
                            </div>

                            <div class="form-floating mb-3">
                                <textarea class="form-control" name="message"
                                        placeholder="Enter your message here..." style="height: 10rem" required></textarea>
                                <label>Message</label>
                            </div>

                            <div class="d-grid">
                                <button class="btn btn-primary btn-lg" type="submit">
                                    Submit
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
    {% endblock %}
